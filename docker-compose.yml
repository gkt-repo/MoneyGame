services:
  money_game_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money_game_app
    restart: always
    network_mode: "host"
    environment:
      - PORT=${PORT:-4000}
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
      - ADMIN_UPI_ID=${ADMIN_UPI_ID:-admin@okhdfcbank}
      - ADMIN_UPI_NAME=${ADMIN_UPI_NAME:-MoneyGame}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-moneygame-secret-key-1234}
      - PLATFORM_COMMISSION_PERCENT=${PLATFORM_COMMISSION_PERCENT:-10}
      - JWT_SECRET=${JWT_SECRET:-moneygame-super-secret-jwt-key}
      - PRISMA_FORCE_RESET=${PRISMA_FORCE_RESET:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-MoneyGame <no-reply@moneygame.com>}
